<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini SVG Scene</title>
</head>
<body>
    <h1>Mini SVG Scene: Sunrise</h1>
    <svg width="400" height="400" viewBox="0 0 400 400" style="border: 1px solid black">
        <rect x="0" y="0" width="400" height="300" fill="#87CEEB" />
        <rect x="0" y="300" width="400" height="100" fill="#228B22" />
        <circle cx="200" cy="350" r="40" fill="yellow">
            <animate 
                attributeName="cy" 
                values="350; 100; 350" 
                dur="5s" 
                repeatCount="indefinite" 
            />
        </circle>
        <line x1="50" y1="100" x2="60" y2="110" stroke="black" stroke-width="2" />
        <line x1="60" y1="110" x2="70" y2="100" stroke="black" stroke-width="2" />
        <line x1="300" y1="120" x2="310" y2="130" stroke="black" stroke-width="2" />
        <line x1="300" y1="120" x2="310" y2="130" stroke="black" stroke-width="2" />
        <line x1="310" y1="130" x2="320" y2="120" stroke="black" stroke-width="2" />
        <circle cx="350" cy="50" r="20" fill="white" opacity="0.8" />
        <circle cx="370" cy="50" r="25" fill="white" opacity="0.8" />

    </svg>
</body>
</html>
