<!DOCTYPE html>
<html lang="en">
<head>
    <title>SVG Traffic Signal</title>
</head>
<body>
    <h2>Traffic Signal</h2>
    <svg width="800" height="500" style="border: 1px solid black; background-color: #7d7d7d;">
        <rect x="100" y="50" width="100" height="300" rx="20" />
        <circle cx="150" cy="100" r="35" fill="red" />
        <circle cx="150" cy="200" r="35" fill="yellow" />
        <circle cx="150" cy="300" r="35" fill="green" />
        <line x1="150" y1="350" x2="150" y2="450" stroke="black" stroke-width="15" />

    </svg>
</body>
</html>
