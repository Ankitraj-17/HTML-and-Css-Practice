<!DOCTYPE html>
<html>
<body>

<svg width="200" height="400">

<rect x="50" y="20" width="100" height="260" fill="gray" stroke="black"/>

<circle cx="100" cy="70" r="30" fill="black">
    <animate attributeName="fill" values="red;black;black" keyTimes="0;0.4;1" dur="5s" repeatCount="indefinite" calcMode="discrete"/>
</circle>
<circle cx="100" cy="150" r="30" fill="black">
    <animate attributeName="fill" values="black;black;yellow;black" keyTimes="0;0.8;0.9;1" dur="5s" repeatCount="indefinite" calcMode="discrete"/>
</circle>
<circle cx="100" cy="230" r="30" fill="black">
    <animate attributeName="fill" values="black;green;black" keyTimes="0;0.4;0.8" dur="5s" repeatCount="indefinite" calcMode="discrete"/>
  </circle>

</svg>

</body>
</html>
