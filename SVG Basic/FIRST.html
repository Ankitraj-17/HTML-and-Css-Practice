<!DOCTYPE html>
<html>
<head>
    <title>Simple SVG Playground</title>
</head>
<body>
    <h1> SVG Playground</h1>
    <svg width="600" height="400" style="border: 2px solid black; background-color: rgb(90, 193, 234);">
         <circle cx="500" cy="80" r="70" fill="orange" stroke="yellow" stroke-width="4" />
         <rect x="0" y="300" width="600" height="100" fill="green" />
         <line x1="0" y1="350" x2="600" y2="350" stroke="white" stroke-width="5" />

    </svg> 
</body>
</html>
